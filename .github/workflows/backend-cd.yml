name: Backend CD

on:
  workflow_run:
    workflows: ["Backend CI"]
    branches: [master]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: backend-cd
  cancel-in-progress: false

jobs:
  publish:
    name: Build & Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.value }}

    steps:
      - name: Resolve commit SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "value=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set image reference
        id: meta
        run: echo "value=ghcr.io/${IMAGE_OWNER}/nexora-backend:${{ steps.sha.outputs.value }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.value }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/nexora-backend:latest
            ${{ steps.meta.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log out from GHCR
        if: always()
        run: docker logout ghcr.io

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE
          script: |
            docker pull "${IMAGE}"

            docker stop nexora-backend 2>/dev/null || true
            docker rm nexora-backend 2>/dev/null || true

            docker network create proxy 2>/dev/null || true

            docker run -d \
              --name nexora-backend \
              --env-file /home/deployer/apps/nexora-backend/.env.production \
              -v /home/deployer/apps/nexora-backend/secrets:/run/secrets:ro \
              --network proxy \
              --restart unless-stopped \
              "${IMAGE}"

            echo "Waiting for container to become healthy..."
            for i in $(seq 1 15); do
              status=$(docker inspect --format='{{.State.Status}}' nexora-backend 2>/dev/null)
              if [ "$status" = "running" ]; then
                echo "Container is running."
                exit 0
              fi
              sleep 2
            done

            echo "Container did not start in time."
            docker logs nexora-backend
            exit 1
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
